<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wplace-数据导出</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Press Start 2P', system-ui; background: #0a0a0a; color: #22c55e; }
        .card { background: #111827; border: 3px solid #22c55e; box-shadow: 0 0 20px rgba(34, 197, 94, 0.3); }
        .header { background: linear-gradient(90deg, #0a0a0a, #1a1a2e); border-bottom: 4px solid #22c55e; }
        .export-area { 
            background: #111827; 
            padding: 40px; 
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 30px;
            max-width: 1600px;
        }
        .export-pie-card { 
            grid-column: 1;
            grid-row: 1;
            background: #0a0f1a; 
            border: 3px solid #22c55e; 
            padding: 30px; 
        }
        .export-history-card { 
            grid-column: 2;
            grid-row: 1;
            background: #0a0f1a; 
            border: 3px solid #22c55e; 
            padding: 30px; 
        }
        .export-chart-card { 
            grid-column: 1 / -1;
            grid-row: 2;
            background: #0a0f1a; 
            border: 3px solid #22c55e; 
            padding: 30px; 
        }
        .chart-box { height: 500px; width: 100%; }
        .pie-chart-box { height: 400px; width: 100%; }
        .history-chart-box { height: 400px; width: 100%; }
        .btn-group button { font-family: 'Press Start 2P'; transition: all 0.2s; }
        .btn-group button.active { background: #22c55e; color: black; box-shadow: 0 0 10px #22c55e; }
        .export-btn { 
            font-family: 'Press Start 2P';
            padding: 15px 30px;
            font-size: 16px;
            border: 3px solid #22c55e;
            background: transparent;
            color: #22c55e;
            cursor: pointer;
            transition: all 0.3s;
        }
        .export-btn:hover { background: #22c55e; color: black; }
    </style>
</head>
<body class="min-h-screen pb-12">
    <header class="header py-6 text-center">
        <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 md:w-12 md:h-12 bg-green-500 text-black flex items-center justify-center text-4xl font-bold rotate-12">📊</div>
                <div>
                    <h1 class="text-4xl tracking-widest text-green-400">数据导出</h1>
                    <p class="text-xs text-green-300 tracking-widest">wplace • EXPORT</p>
                </div>
            </div>
            <div class="text-right">
                <button onclick="exportToImage()" class="export-btn">📥 导出为图片</button>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 pt-8">
        <!-- 导出预览区域 -->
        <div id="export-preview" class="export-area">
            <!-- 左上角：颜色占比 -->
            <div class="export-pie-card">
                <h3 class="text-2xl font-bold tracking-widest mb-6">实时颜色占比 (Top 15)</h3>
                <div id="export-pie-chart" class="pie-chart-box"></div>
            </div>

            <!-- 右上角：历史所有数据 -->
            <div class="export-history-card">
                <h3 class="text-2xl font-bold tracking-widest mb-6">颜色历史趋势 (全部数据)</h3>
                <div id="export-history-chart" class="history-chart-box"></div>
            </div>

            <!-- 下方：选择导出的数据 -->
            <div class="export-chart-card">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-bold tracking-widest">选择导出的数据范围</h3>
                    <div class="btn-group flex gap-2 text-xs flex-wrap">
                        <button id="btn-24h" class="active px-6 py-2 border border-green-500" onclick="setMode('24h')">近24小时</button>
                        <button id="btn-3days" class="px-6 py-2 border border-green-500" onclick="setMode('3days')">近3天</button>
                        <button id="btn-7days" class="px-6 py-2 border border-green-500" onclick="setMode('7days')">近7天</button>
                        <button id="btn-week" class="px-6 py-2 border border-green-500" onclick="setMode('week')">近1周</button>
                        <button id="btn-month" class="px-6 py-2 border border-green-500" onclick="setMode('month')">近1月</button>
                    </div>
                </div>
                <div id="export-line-chart" class="chart-box"></div>
            </div>
        </div>
    </div>

    <footer class="text-center text-[10px] text-zinc-500 mt-16">
        wplace-WebMonitor • 数据导出工具
    </footer>

    <script>
        let pieChart = echarts.init(document.getElementById('export-pie-chart'));
        let historyChart = echarts.init(document.getElementById('export-history-chart'));
        let lineChart = echarts.init(document.getElementById('export-line-chart'));

        let currentMode = '24h';
        let realtimeData = null;
        let threeDaysData = null;
        let sevenDaysData = null;
        let historyData = null;

        function fetchRealtime() {
            fetch('data/realtime_colors.json?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    realtimeData = data;
                    const latestStats = realtimeData.records?.[realtimeData.records.length-1]?.stats || {};
                    const pieData = Object.entries(latestStats).slice(0,15)
                        .map(([color,val]) => ({name:color, value:val, itemStyle:{color}}));

                    pieChart.setOption({
                        tooltip: { trigger: 'item', formatter: '{b}: {c}%' },
                        legend: { top: '5%', left: 'center', type: 'scroll', textStyle: { color: '#22c55e', fontSize: 12 } },
                        series: [{ type: 'pie', radius: ['40%', '70%'], data: pieData, label: { color: '#ddd' } }]
                    });
                })
                .catch(() => {});
        }

        function fetchHistory() {
            fetch('data/history_colors.json?t=' + Date.now())
                .then(res => res.json())
                .then(d => { 
                    historyData = d; 
                    updateHistoryChart();
                    refreshCharts();
                })
                .catch(() => {});
        }

        function fetchThreeDays() {
            fetch('data/three_days.json?t=' + Date.now())
                .then(res => res.json())
                .then(d => { threeDaysData = d; refreshCharts(); })
                .catch(() => {});
        }

        function fetchSevenDays() {
            fetch('data/seven_days.json?t=' + Date.now())
                .then(res => res.json())
                .then(d => { sevenDaysData = d; refreshCharts(); })
                .catch(() => {});
        }

        function updateHistoryChart() {
            if (!historyData?.daily_noon || historyData.daily_noon.length === 0) return;

            const list = historyData.daily_noon;
            const lastStats = list[list.length-1].stats || {};
            const topColors = Object.keys(lastStats)
                .sort((a,b) => (lastStats[b]||0) - (lastStats[a]||0))
                .slice(0, 6);

            const xData = list.map(item => item.date);
            const series = topColors.map(color => ({
                name: color,
                type: 'line',
                smooth: true,
                data: list.map(item => item.stats[color] || 0),
                itemStyle: { color },
                lineStyle: { width: 3 }
            }));

            historyChart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { type: 'scroll', bottom: 30, textStyle: { color: '#22c55e' } },
                grid: { left: '8%', right: '8%', bottom: 60 },
                xAxis: { type: 'category', data: xData, axisLabel: { color: '#aaa' } },
                yAxis: { type: 'value', axisLabel: { color: '#aaa' } },
                series: series
            });
        }

        function filterRecords(mode) {
            if (mode === '24h') return realtimeData?.records || [];
            if (mode === '3days') return threeDaysData?.records || [];
            if (mode === '7days') return sevenDaysData?.records || [];
            let days = mode === 'week' ? 7 : (mode === 'month' ? 30 : 9999);
            const cutoff = new Date(Date.now() - days*86400000).toISOString().split('T')[0];
            return (historyData?.daily_noon || []).filter(r => r.date >= cutoff);
        }

        function updateLineChart() {
            const list = filterRecords(currentMode);
            if (!list || list.length === 0) {
                lineChart.clear();
                return;
            }

            const lastStats = list[list.length-1].stats || {};
            const topColors = Object.keys(lastStats)
                .sort((a,b) => (lastStats[b]||0) - (lastStats[a]||0))
                .slice(0, 6);

            const xData = list.map(item => {
                return (currentMode === '24h' || currentMode === '3days') 
                    ? item.timestamp.split(' ')[1].slice(0,5) 
                    : item.date;
            });

            const series = topColors.map(color => ({
                name: color,
                type: 'line',
                smooth: true,
                data: list.map(item => item.stats[color] || 0),
                itemStyle: { color },
                lineStyle: { width: 3 }
            }));

            lineChart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { type: 'scroll', bottom: 30, textStyle: { color: '#22c55e' } },
                grid: { left: '8%', right: '8%', bottom: 60 },
                xAxis: { type: 'category', data: xData, axisLabel: { color: '#aaa', fontSize: 10 } },
                yAxis: { type: 'value', axisLabel: { color: '#aaa' } },
                series: series
            });
        }

        function refreshCharts() {
            updateLineChart();
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.btn-group button').forEach(b => 
                b.classList.toggle('active', b.id === `btn-${mode}`)
            );
            refreshCharts();
        }

        function exportToImage() {
            const element = document.getElementById('export-preview');
            
            // 显示加载提示
            const btn = document.querySelector('.export-btn');
            const originalText = btn.textContent;
            btn.textContent = '⏳ 生成中...';
            btn.disabled = true;

            html2canvas(element, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#111827',
                logging: false,
                windowWidth: element.scrollWidth,
                windowHeight: element.scrollHeight
            }).then(canvas => {
                // 下载图片
                const link = document.createElement('a');
                link.download = `wplace_export_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // 恢复按钮
                btn.textContent = originalText;
                btn.disabled = false;
            }).catch(err => {
                console.error('导出失败:', err);
                alert('导出失败，请重试');
                btn.textContent = originalText;
                btn.disabled = false;
            });
        }

        window.onload = () => {
            fetchRealtime();
            fetchHistory();
            fetchThreeDays();
            fetchSevenDays();

            setInterval(fetchRealtime, 15000);
            setInterval(fetchThreeDays, 30000);
            setInterval(fetchSevenDays, 30000);
            setInterval(fetchHistory, 60000);

            window.onresize = () => {
                pieChart.resize();
                historyChart.resize();
                lineChart.resize();
            };
        };
    </script>
</body>
</html>
